name: Release

# Push a tag like v0.1.0 to build binaries for every platform and attach
# them to a GitHub Release.
on:
  push:
    tags: ["v*"]

# Read-only by default; only the final publish job can write to the repo.
permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (the tag is in the
# comment). No build cache here, so a poisoned cache can't reach a release.
jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: macos-latest,   target: aarch64-apple-darwin,     archive: tar.gz }
          # Intel Mac binary is cross-compiled on the Apple Silicon runner.
          - { os: macos-latest,   target: x86_64-apple-darwin,      archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   archive: zip }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --all --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          name="threadai-${TAG}-${TARGET}"
          mkdir "$name"
          cp "target/${TARGET}/release/threadai" README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          $name = "threadai-$env:TAG-$env:TARGET"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/$env:TARGET/release/threadai.exe", README.md, LICENSE $name
          Compress-Archive $name "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: threadai-*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: threadai-*
          generate_release_notes: true
