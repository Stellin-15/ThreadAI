[package]
name = "threadai"
version = "0.1.0"
edition = "2021"
description = "Fast, offline security pattern scanner for JS/TS, Python, Rust and secrets"
license = "MIT"
repository = "https://github.com/Stellin-15/ThreadAI"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
colored = "2"
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
